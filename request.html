<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Railway Block Planner - Add Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Railway Block Planner</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="schedule.html">Block Schedule</a>
            <a href="request.html">Add Request</a>
        </nav>
    </header>

    <main>
        <h2>Add Maintenance Request</h2>

        <form class="request-form" id="requestForm">
            <label for="department">Department</label>
            <select id="department" required>
                <option value="">-- Select --</option>
                <option value="Engineering">Engineering</option>
                <option value="Signal & Telecom">Signal & Telecom</option>
                <option value="Traction Distribution">Traction Distribution</option>
            </select>

            <label for="section">Section / Track ID</label>
            <input type="text" id="section" placeholder="e.g. Sec A-12" required>

            <label for="issue">Issue Description</label>
            <textarea id="issue" rows="3" placeholder="Describe the defect or maintenance need" required></textarea>

            <label for="priority">Priority</label>
            <select id="priority" required>
                <option value="">-- Select --</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>

            <button type="submit">Submit Request</button>
        </form>

        <p id="confirmMsg" class="confirm-msg"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
